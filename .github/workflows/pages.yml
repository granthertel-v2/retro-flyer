# GitHub Pages deploy (REQUIREMENTS §10, §9 Day 4).
#
# Deliberately separate from `ci.yml` rather than a fourth job in it. A deploy is not
# a test: it wants its own permissions, its own concurrency rule and its own
# environment, and folding it in would give the validation suite write access to a
# published site for no reason at all.
#
# It does not depend on the CI workflow either, which is a real decision and worth
# naming. Pages is where someone else flies this; the suite is where the flight model
# is proved. Gating the deploy on the suite sounds obviously right and would mean a
# red break-check — a slow, twelve-run job that only runs on main — could hold up a
# renderer fix that has nothing to do with it. The suite still runs on every push and
# still goes red in the open.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one mid-flight: a cancelled deploy can
# leave the site serving half of one build and half of another.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `base: './'` in vite.config.ts is what makes this work under a project page's
      # /retro-flyer/ prefix without the repository name being written down anywhere.
      - name: Build
        working-directory: packages/app
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

      - id: deploy
        uses: actions/deploy-pages@v4
